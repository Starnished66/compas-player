name: Daily executable build

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.board }} executables
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        board: [r1, r3proii, r3ii_2025]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake git patch python3 curl xz-utils pkg-config libsdl2-dev file
      - name: Install verified MIPS musl toolchain
        run: |
          toolchain_dir="$(scripts/tools/toolchain/install_mips_toolchain.sh "$RUNNER_TEMP")"
          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"
      - name: Build player and bootloader
        id: outputs
        run: |
          set -euo pipefail
          board='${{ matrix.board }}'
          suffix="_$board"
          if [ "$board" = r1 ]; then suffix=; fi
          make -j2 target BOARD="$board"
          make bootloader BOARD="$board"
          player="compas_player_target$suffix"
          loader="compas_loader$suffix"
          test -s "$player"
          test -s "$loader"
          for binary in "$player" "$loader"; do
            file "$binary"
            mipsel-linux-musl-readelf -h "$binary" | grep 'Machine:.*MIPS' >/dev/null
          done
          echo "player=$player" >> "$GITHUB_OUTPUT"
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: compas-executables-${{ matrix.board }}
          if-no-files-found: error
          path: |
            ${{ steps.outputs.outputs.player }}
            ${{ steps.outputs.outputs.loader }}
